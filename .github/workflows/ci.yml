name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# No interrumpir un deploy de main. Los pushes nuevos de un PR sustituyen su CI anterior.
concurrency:
  group: travelpal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
      NEXT_PUBLIC_LOG_LEVEL: ${{ secrets.NEXT_PUBLIC_LOG_LEVEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Set default NEXT_PUBLIC_LOG_LEVEL when secret is missing
        run: |
          echo "NEXT_PUBLIC_LOG_LEVEL=${NEXT_PUBLIC_LOG_LEVEL:-warn}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:ci
      - name: Congelar los caminos de datos (issue 38, etapa 0)
        run: node scripts/check-data-paths.mjs
      - run: npm run build

  # Probar el codigo en PR y main ANTES del deploy; repetir despues en produccion.
  # La suite vive en .github/workflows/e2e.yml.
  e2e:
    needs: [build]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  e2e-produccion:
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e.yml
    with:
      base-url: https://app-viajes.prg-dev.workers.dev
    secrets: inherit

  worker:
    name: worker-build
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      # OpenNext genera cloudflare/next-env.mjs leyendo los ficheros .env (NO process.env).
      # Sin este fichero el worker arranca con next-env.mjs vacio y revienta (500 Server failed
      # to respond). Los valores no se imprimen: van directos al fichero.
      - name: Escribir .env.local para el build de OpenNext
        run: |
          printf 'NEXT_PUBLIC_INSFORGE_URL=%s\nNEXT_PUBLIC_INSFORGE_ANON_KEY=%s\nINSFORGE_API_KEY=%s\n' \
            "${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}" \
            "${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}" \
            "${{ secrets.INSFORGE_API_KEY }}" > .env.local
      - name: Build the Cloudflare Worker (no deploy)
        run: npx opennextjs-cloudflare build

  deploy:
    needs: [build, worker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
      - run: npm ci
      - name: Escribir .env.local para el build de OpenNext
        run: |
          printf 'NEXT_PUBLIC_INSFORGE_URL=%s\nNEXT_PUBLIC_INSFORGE_ANON_KEY=%s\nINSFORGE_API_KEY=%s\n' \
            "${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}" \
            "${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}" \
            "${{ secrets.INSFORGE_API_KEY }}" > .env.local
      - name: Build the Cloudflare Worker
        run: npx opennextjs-cloudflare build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c0fd3bd608ffa8d338164c60b7148c85
          NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
          NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
      - name: Deploy the Cloudflare Worker
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c0fd3bd608ffa8d338164c60b7148c85
          NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
          NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
          INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
