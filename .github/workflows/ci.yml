name: CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# No interrumpir un deploy de main. Los pushes nuevos de un PR sustituyen su CI anterior.
concurrency:
  group: travelpal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - name: Configurar imports Deno de la función
        env:
          ZOD_SPECIFIER: npm:zod@4.1.12
        run: 'printf ''{"imports":{"zod":"%s"},"compilerOptions":{"lib":["deno.window","deno.ns","dom"],"strict":true}}'' "$ZOD_SPECIFIER" > "$RUNNER_TEMP/travel-inspiration-deno.json"'
      - name: Probar función de inspiración
        run: deno test --config "$RUNNER_TEMP/travel-inspiration-deno.json" --no-lock --allow-env --allow-net insforge/functions/travel-inspiration/index_test.ts
      - name: Empaquetar función de inspiración
        env:
          INSFORGE_SDK_SPECIFIER: npm:@insforge/sdk
        run: deno bundle --config "$RUNNER_TEMP/travel-inspiration-deno.json" --no-lock --platform deno --packages bundle --output "$RUNNER_TEMP/travel-inspiration.js" --external="$INSFORGE_SDK_SPECIFIER" insforge/functions/travel-inspiration/index.ts
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test:ci
      - run: pnpm run test:trip-owner-rls
      - run: pnpm run test:timezone
      - name: Congelar los caminos de datos (issue 38, etapa 0)
        run: node scripts/check-data-paths.mjs
      - run: pnpm run build
      - name: Validar export estático
        run: pnpm run validate:static-export
      - name: Validar cabeceras de seguridad
        run: pnpm run check:headers
      - name: Validar SEO del export
        run: pnpm run check:seo
      - run: pnpm run build-storybook
      - name: Subir export estático
        uses: actions/upload-artifact@v4
        with:
          name: travelpal-static-export
          path: out/
          if-no-files-found: error
          retention-days: 1

  # Validar el empaquetado local antes de que el E2E y el deploy consuman el artefacto.
  worker:
    name: worker-build
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Descargar export estático
        uses: actions/download-artifact@v4
        with:
          name: travelpal-static-export
          path: out/
      - name: Validar contenido exportado
        run: pnpm run validate:static-export
      - name: Validar configuración y empaquetado de Wrangler
        run: pnpm exec wrangler deploy --dry-run --no-autoconfig

  # Probar el export del PR y main ANTES del deploy; repetir tras publicar en producción.
  e2e:
    needs: [build]
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  e2e-produccion:
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e.yml
    with:
      base-url: https://travelpal.prg-dev.workers.dev
    secrets: inherit

  deploy:
    needs: [build, worker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Descargar export validado
        uses: actions/download-artifact@v4
        with:
          name: travelpal-static-export
          path: out/
      - name: Publicar assets-only Worker
        run: pnpm exec wrangler deploy --no-autoconfig
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c0fd3bd608ffa8d338164c60b7148c85
