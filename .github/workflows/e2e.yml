name: E2E

# Suite de Playwright reutilizable (issue 72). El destino lo elige quien la llama
# con `base-url`: vacio corre contra el dev server local que arranca Playwright
# (lo que prueba el codigo del PR) y con URL corre contra lo ya desplegado.
on:
  workflow_call:
    inputs:
      base-url:
        description: URL contra la que corre la suite. Vacio = dev server local.
        required: false
        type: string
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.NEXT_PUBLIC_INSFORGE_URL }}
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_INSFORGE_ANON_KEY }}
      INSFORGE_API_KEY: ${{ secrets.INSFORGE_API_KEY }}
      E2E_BASE_URL: ${{ inputs.base-url }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Sin el usuario dedicado el caso de login se omite y el job quedaria verde
      # sin haber probado la sesion: mejor fallar aqui y decir que falta.
      - name: Exigir el usuario dedicado de e2e
        run: |
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::error::Faltan los secrets E2E_USER_EMAIL y E2E_USER_PASSWORD en este repositorio."
            exit 1
          fi
      - name: Instalar chromium
        run: npx playwright install --with-deps chromium
      - name: Correr el smoke e2e
        run: npm run test:e2e
      # La traza solo se genera en el primer reintento (trace: on-first-retry).
      - name: Subir la traza del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
