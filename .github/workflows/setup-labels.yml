name: Setup Labels
on:
  push:
    branches: [ main ]
    paths:
      - '.github/labels.json'
  workflow_dispatch:

jobs:
  create-labels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read labels config
        id: labels
        run: echo "config=$(cat .github/labels.json | tr -d '\n')" >> $GITHUB_OUTPUT
      - name: Create labels if missing
        uses: actions/github-script@v7
        with:
          script: |
            const labels = JSON.parse(process.env.CONFIG);
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name });
              } catch (e) {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label.name, color: label.color, description: label.description || '' });
              }
            }
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CONFIG: ${{ steps.labels.outputs.config }}